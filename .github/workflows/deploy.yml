name: Deploy DOVA ECOTECH to GitHub Pages

on:
  # Tự động kích hoạt khi có commit mới đẩy lên nhánh main hoặc master
  push:
    branches:
      - main
      - master

  # Cho phép bấm nút "Run workflow" thủ công trong thẻ Actions trên GitHub
  workflow_dispatch:

# Cấp quyền ghi cần thiết để xuất bản lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Giới hạn 1 tiến trình deploy tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Tải lên toàn bộ thư mục web
        uses: actions/upload-pages-artifact@v3
        with:
          # Thư mục gốc chứa index.html và assets
          path: '.'

      - name: Xuất bản lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
