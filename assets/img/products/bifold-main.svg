<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradbfmain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0F0A" />
      <stop offset="50%" stop-color="#2B1A12" />
      <stop offset="100%" stop-color="#331A10" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D69A4B" />
      <stop offset="50%" stop-color="#B08D57" />
      <stop offset="100%" stop-color="#B5712F" />
    </linearGradient>
    <pattern id="grainbfmain" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="15" r="1.5" fill="#D69A4B" opacity="0.12" />
      <circle cx="45" cy="22" r="1.2" fill="#F6EFE0" opacity="0.08" />
      <circle cx="30" cy="48" r="2" fill="#B5712F" opacity="0.15" />
      <circle cx="50" cy="52" r="1" fill="#EFE5CF" opacity="0.1" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGradbfmain)" />
  <rect width="100%" height="100%" fill="url(#grainbfmain)" />
  <rect x="40" y="40" width="1120" height="720" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.45" />
  
  <!-- Subtle Coffee Bean Emblem Graphic -->
  <g transform="translate(600, 340) scale(1.6)" opacity="0.18">
    <ellipse cx="0" cy="0" rx="90" ry="80" stroke="#F6EFE0" stroke-width="2" fill="none"/>
    <path d="M 0 -70 C -45 -70, -70 -35, -70 0 C -70 35, -45 70, 0 70 Z" fill="#F6EFE0"/>
    <path d="M 0 -70 C 45 -70, 70 -35, 70 0 C 70 35, 45 70, 0 70 Z" fill="#F6EFE0"/>
  </g>

  <!-- Tag Label -->
  <rect x="80" y="80" width="160" height="34" rx="4" fill="#1A0F0A" opacity="0.85" />
  <text x="160" y="102" font-family="'Jost', 'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#D69A4B" text-anchor="middle">BIFOLD</text>

  <!-- Prototype Badge -->
  <rect x="990" y="80" width="130" height="34" rx="4" fill="#B5712F" opacity="0.9" />
  <text x="1055" y="102" font-family="'Jost', 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#F6EFE0" text-anchor="middle">PROTOTYPE</text>

  <!-- Main Headline -->
  <text x="600" y="430" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#F6EFE0" text-anchor="middle" letter-spacing="1">VÍ BIFOLD — NAM</text>
  
  <!-- Note / Caption -->
  <text x="600" y="480" font-family="'Jost', 'Inter', sans-serif" font-size="18" fill="#D8C7A4" text-anchor="middle" letter-spacing="1">Dáng gập cổ điển, mỏng nhẹ, vừa vặn mọi túi quần</text>
  <line x1="520" y1="510" x2="680" y2="510" stroke="url(#goldGrad)" stroke-width="2" />
  <text x="600" y="540" font-family="'Jost', 'Inter', sans-serif" font-size="13" fill="#B08D57" text-anchor="middle" letter-spacing="2">DOVA ECOTECH &#8226; VISUAL CONCEPT</text>
</svg>

