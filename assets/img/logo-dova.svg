<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D69A4B" />
      <stop offset="50%" stop-color="#B08D57" />
      <stop offset="100%" stop-color="#B5712F" />
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6EFE0" />
      <stop offset="100%" stop-color="#EFE5CF" />
    </linearGradient>
  </defs>
  
  <!-- Emblem: Stylized Geometric Coffee Bean / Smart Node -->
  <g transform="translate(10, 8)">
    <!-- Outer Bean Halo -->
    <ellipse cx="27" cy="27" rx="25" ry="23" stroke="url(#goldGrad)" stroke-width="1.8" fill="none" opacity="0.85" stroke-dasharray="2 3"/>
    <!-- Bean Shape Left Half -->
    <path d="M 27 7 C 15 7, 7 17, 7 27 C 7 37, 15 47, 27 47 C 24 37, 24 17, 27 7 Z" fill="url(#goldGrad)" opacity="0.95" />
    <!-- Bean Shape Right Half -->
    <path d="M 27 7 C 39 7, 47 17, 47 27 C 47 37, 39 47, 27 47 C 30 37, 30 17, 27 7 Z" fill="url(#goldGrad)" />
    <!-- Center S-curve split line -->
    <path d="M 27 9 Q 22 27 27 45" stroke="#1A0F0A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Smart Tech Pulse Dot -->
    <circle cx="27" cy="27" r="3" fill="#F6EFE0" />
    <circle cx="27" cy="27" r="6" stroke="#D69A4B" stroke-width="1" fill="none" opacity="0.75" />
  </g>

  <!-- Wordmark DOVA -->
  <text x="80" y="42" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="4" fill="#2B1A12">DOVA</text>
  
  <!-- Submark ECOTECH -->
  <text x="235" y="42" font-family="'Jost', 'Inter', sans-serif" font-size="16" font-weight="500" letter-spacing="7" fill="url(#goldGrad)">ECOTECH</text>

  <!-- Tagline underneath -->
  <text x="82" y="58" font-family="'Jost', 'Inter', sans-serif" font-size="8.5" font-weight="400" letter-spacing="4.5" fill="#4A2C1C" opacity="0.8">COFFEE COMPOSITE &#8226; RFID BLOCKING &#8226; SMART TAG</text>
</svg>

